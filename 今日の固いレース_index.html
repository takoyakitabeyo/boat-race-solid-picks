<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="今日の競艇・固いレースだけを表示する個人用Webアプリ">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
*{box-sizing:border-box}
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#e8edf7;background:#08101d}
body{margin:0;background:linear-gradient(180deg,#08101d,#0e1727 55%,#09111e);min-height:100vh}
.app{max-width:760px;margin:auto;padding:20px 14px 40px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:#7e91ae}
h1{margin:4px 0 2px;font-size:28px}
h2{font-size:16px;margin:0 0 10px}
.muted{color:#8d9bb0;font-size:12px}
button{font:inherit}
.refresh{border:1px solid #33445f;background:#142139;color:#fff;border-radius:10px;padding:9px 13px}
.status-card,.race-card,.rules,.notice{background:#111c2e;border:1px solid #24334a;border-radius:16px}
.status-card{margin-top:16px;padding:13px 15px;display:flex;justify-content:space-between;gap:10px}
.status-title{font-size:11px;color:#8d9bb0;margin-bottom:3px}
.notice{margin-top:12px;padding:12px 14px;color:#c9d4e5;font-size:13px}
.hidden{display:none}
#picks{margin-top:14px;display:grid;gap:12px}
.race-card{padding:15px}
.race-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.race-name{font-size:19px;font-weight:750}
.score{font-size:12px;color:#9fb3d2}
.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#203653;color:#d9e7ff;font-size:11px}
.pick{margin-top:13px;padding:12px;border-radius:12px;background:#0b1525;border:1px solid #263b58}
.pick-main{font-size:26px;font-weight:800;letter-spacing:.05em}
.pick-label{font-size:11px;color:#8d9bb0}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.metric{background:#121f33;border-radius:10px;padding:9px}
.metric b{display:block;font-size:14px}
.metric span{font-size:10px;color:#8d9bb0}
.reason{margin-top:11px;font-size:12px;line-height:1.7;color:#c7d2e4}
.racers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px}
.racer{padding:7px 3px;text-align:center;background:#0d1727;border-radius:8px;font-size:10px}
.racer b{display:block;font-size:13px}
.rules{margin-top:14px;padding:14px;color:#b8c5d8;font-size:12px;line-height:1.7}
.rules ul{padding-left:18px;margin:6px 0 0}
footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px;color:#667891;font-size:10px}
.empty{padding:28px 15px;text-align:center;background:#111c2e;border:1px dashed #33445f;border-radius:16px;color:#aab7c9}
@media(max-width:520px){h1{font-size:24px}.rows{grid-template-columns:1fr 1fr}.racers{grid-template-columns:repeat(3,1fr)}}

</style>
  <title>今日の固いレース</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">BOAT RACE / PERSONAL</div>
        <h1>今日の固いレース</h1>
        <div id="date" class="muted"></div>
      </div>
      <button id="refresh" class="refresh">更新</button>
    </header>

    <section class="status-card">
      <div>
        <div class="status-title">判定状況</div>
        <div id="status">データ取得中…</div>
      </div>
      <div id="updated" class="muted"></div>
    </section>

    <section id="notice" class="notice hidden"></section>
    <section id="picks"></section>

    <section class="rules">
      <h2>このアプリの基準</h2>
      <ul>
        <li>推奨レースが少なくても、基準未達なら無理に表示しません。</li>
        <li>1着候補の信頼度を最重視し、2・3着候補を別に評価します。</li>
        <li>展示タイム・進入・STなどの直前情報が取得できたら再評価します。</li>
        <li>結果が取得できたレースは端末内の履歴に記録します。</li>
      </ul>
    </section>

    <footer>
      <span>データ：Boatrace Open API</span>
      <span>このアプリは投票を行いません</span>
    </footer>
  </main>
  <script>
const API="https://boatraceopenapi.github.io/api/v1/today.json";
const STADIUMS={1:"桐生",2:"戸田",3:"江戸川",4:"平和島",5:"多摩川",6:"浜名湖",7:"蒲郡",8:"常滑",9:"津",10:"三国",11:"びわこ",12:"住之江",13:"尼崎",14:"鳴門",15:"丸亀",16:"児島",17:"宮島",18:"徳山",19:"下関",20:"若松",21:"芦屋",22:"福岡",23:"唐津",24:"大村"};

const $=s=>document.querySelector(s);
const num=v=>Number.isFinite(Number(v))?Number(v):null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function rankName(n){return ({1:"A1",2:"A2",3:"B1",4:"B2"}[n]||"-")}
function fmtTime(s){if(!s)return "--:--"; return s.slice(11,16)}
function nowJST(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"}))}
function scoreRace(r){
  const rs=Object.values(r.racers||{}).sort((a,b)=>a.entry_number-b.entry_number);
  if(rs.length!==6)return null;
  const one=rs.find(x=>x.entry_number===1);
  const preview=r.preview||{};
  const prs=preview.racers||{};
  const p1=prs["1"]||{};
  const rank1=one.rank_number;
  const course1=p1.course_number||1;

  // 「固い」判定は1着候補の強さを中心にする。数値は個人用の保守的なスコア。
  let s=0;
  s += ({1:22,2:15,3:8,4:2}[rank1]||0);
  s += clamp((num(one.national_win_rate)||0)*3.2,0,24);
  s += clamp((num(one.local_win_rate)||0)*2.2,0,14);
  s += clamp((num(one.national_top_3_percent)||0)*0.10,0,9);
  s += clamp((num(one.local_top_3_percent)||0)*0.06,0,5);
  s += clamp((num(one.motor_top_3_percent)||0)*0.05,0,4);
  s += clamp((num(one.average_start_timing)!=null?(0.25-one.average_start_timing)*25:0),-3,5);
  if(course1===1)s+=5;

  const rivals=rs.slice(1).map(x=>{
    let v=0;
    v += ({1:17,2:13,3:8,4:3}[x.rank_number]||0);
    v += clamp((num(x.national_win_rate)||0)*1.8,0,12);
    v += clamp((num(x.motor_top_3_percent)||0)*0.04,0,3);
    return {x,v};
  }).sort((a,b)=>b.v-a.v);

  // 展示がある場合は直前情報を加味
  const ex=rs.map(x=>({x,t:num(prs[String(x.entry_number)]?.exhibition_time)})).filter(z=>z.t!=null);
  if(ex.length===6){
    const sorted=[...ex].sort((a,b)=>a.t-b.t);
    const pos=sorted.findIndex(z=>z.x.entry_number===1);
    if(pos===0)s+=5; else if(pos===1)s+=2; else if(pos>=4)s-=5;
  }
  const p1st=prs["1"];
  if(p1st?.start_timing!=null){
    const st=num(p1st.start_timing);
    if(st<=0.10)s+=3; else if(st>=0.20)s-=3;
  }

  // 1号艇が強くても相手が強すぎる場合は落とす
  const strongestRival=rivals[0];
  const rivalGap=(s-(strongestRival?.v||0));
  const confidence=clamp(Math.round(s),0,100);

  // 2着候補・3着候補：総合力＋展示
  const candidateScores=rs.slice(1).map(x=>{
    const p=prs[String(x.entry_number)]||{};
    let v=({1:17,2:13,3:8,4:3}[x.rank_number]||0)
      +(num(x.national_top_3_percent)||0)*0.08
      +(num(x.local_top_3_percent)||0)*0.04
      +(num(x.motor_top_3_percent)||0)*0.04;
    if(p.course_number && p.course_number<=3)v+=2;
    if(p.exhibition_time!=null)v+=Math.max(0,1-(num(p.exhibition_time)||7))*8;
    return {x,v};
  }).sort((a,b)=>b.v-a.v);

  const a=candidateScores[0]?.x.entry_number;
  const b=candidateScores[1]?.x.entry_number;
  const c=candidateScores[2]?.x.entry_number;

  // 厳格に表示。100点満点ではなく「内部スコア」。最低ラインを高めに設定。
  const show = confidence>=68 && rivalGap>=45 && rank1<=2 && (num(one.national_top_3_percent)||0)>=50;

  return {r,s:confidence,show,rank1,a,b,c,one,racers:rs,preview:prs};
}

function combos(x){
  if(!x.a)return [];
  const out=[`1-${x.a}-${x.b}`,`1-${x.b}-${x.a}`];
  if(x.c)out.push(`1-${x.a}-${x.c}`,`1-${x.c}-${x.a}`);
  return [...new Set(out)];
}

function reasons(x){
  const o=x.one;
  const p=x.preview["1"]||{};
  const rr=[];
  rr.push(`${rankName(o.rank_number)}・全国勝率 ${num(o.national_win_rate)?.toFixed(2)??"-"}`);
  if(num(o.local_win_rate)!=null)rr.push(`当地勝率 ${num(o.local_win_rate).toFixed(2)}`);
  if(num(o.national_top_3_percent)!=null)rr.push(`全国3連対率 ${num(o.national_top_3_percent).toFixed(1)}%`);
  if(p.exhibition_time!=null)rr.push(`展示 ${num(p.exhibition_time).toFixed(2)}秒`);
  if(p.start_timing!=null)rr.push(`展示ST ${num(p.start_timing).toFixed(2)}`);
  return rr.join(" / ");
}

function renderPick(x){
  const r=x.r;
  const combosText=combos(x);
  const racers=x.racers.map(z=>`<div class="racer"><b>${z.entry_number}</b>${z.name}<br>${rankName(z.rank_number)}</div>`).join("");
  return `<article class="race-card">
    <div class="race-head">
      <div><div class="race-name">${STADIUMS[r.stadium_number]||"場"+r.stadium_number} ${r.race_number}R</div>
      <div class="muted">${r.title||""}</div><span class="badge">締切 ${fmtTime(r.closed_at)}</span></div>
      <div class="score">信頼度 ${x.s}/100</div>
    </div>
    <div class="pick">
      <div class="pick-label">1着本命</div>
      <div class="pick-main">① ${x.one.name}</div>
      <div class="rows">
        <div class="metric"><b>本線</b><span>${combosText.slice(0,2).join(" / ")}</span></div>
        <div class="metric"><b>押さえ</b><span>${combosText.slice(2).join(" / ")||"なし"}</span></div>
      </div>
      <div class="reason">${reasons(x)}</div>
    </div>
    <div class="racers">${racers}</div>
  </article>`;
}

async function load(){
  $("#status").textContent="データ取得中…";
  $("#notice").classList.add("hidden");
  try{
    const res=await fetch(API,{cache:"no-store"});
    if(!res.ok)throw new Error("API "+res.status);
    const data=await res.json();
    const races=[];
    for(const [sid,stadium] of Object.entries(data.programs?.stadiums||{})){
      for(const [,r] of Object.entries(stadium.races||{})){
        if(!r.result?.racers)races.push(r);
        else {
          // 結果済みでも履歴保存用に処理
          saveResult(r);
        }
      }
    }
    const scored=races.map(scoreRace).filter(Boolean).filter(x=>x.show)
      .sort((a,b)=>b.s-a.s || new Date(a.r.closed_at)-new Date(b.r.closed_at));
    $("#date").textContent=(races[0]?.date||new Date().toLocaleDateString("ja-JP"));
    $("#updated").textContent=`更新 ${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}`;
    $("#status").textContent=scored.length?`${scored.length}レースを推奨`:"本日は推奨なし";
    if(!scored.length){
      $("#picks").innerHTML=`<div class="empty"><b>本日は、現時点で推奨できる「固いレース」はありません。</b><br><span class="muted">基準を満たさないレースは無理に表示しません。</span></div>`;
    }else $("#picks").innerHTML=scored.map(renderPick).join("");
    localStorage.setItem("lastLoaded",new Date().toISOString());
  }catch(e){
    $("#status").textContent="取得できませんでした";
    $("#notice").textContent="データ取得に失敗しました。時間を置いて「更新」を押してください。";
    $("#notice").classList.remove("hidden");
    console.error(e);
  }
}

function saveResult(r){
  try{
    const key="boatResults";
    const history=JSON.parse(localStorage.getItem(key)||"{}");
    const trif=r.result?.payouts?.trifecta?.[0]?.combination;
    if(trif)history[`${r.date}-${r.stadium_number}-${r.race_number}`]={combination:trif,at:new Date().toISOString()};
    localStorage.setItem(key,JSON.stringify(history));
  }catch{}
}

$("#refresh").addEventListener("click",load);
load();
setInterval(load,180000);

</script>
</body>
</html>

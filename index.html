<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#071426">

<meta
  name="description"
  content="予想屋サイバーはっちゃん"
>

<title>予想屋サイバーはっちゃん</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #071426;
}

body {
  color: #f5f7fb;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  overflow-x: hidden;
}

button {
  font: inherit;
}

.app {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 22px 16px 45px;
}


/* =====================
   ヘッダー
===================== */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.eyebrow {
  color: #42a5ff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.8px;
  margin-bottom: 6px;
}

h1 {
  margin: 0;
  font-size: 26px;
  line-height: 1.25;
  letter-spacing: -0.8px;
}

#date {
  margin-top: 6px;
  font-size: 13px;
}

.muted {
  color: #8fa2b8;
}

.refresh {
  flex-shrink: 0;

  padding: 11px 16px;

  border: 1px solid #1768a8;
  border-radius: 14px;

  background: #0d2944;
  color: white;

  font-weight: 700;
}


/* =====================
   判定状況
===================== */

.status-card {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 12px;

  padding: 17px 18px;
  margin-bottom: 16px;

  border: 1px solid #203b59;
  border-radius: 18px;

  background: #0d2035;
}

.status-title {
  color: #8fa2b8;
  font-size: 12px;
  margin-bottom: 4px;
}

#status {
  font-size: 17px;
  font-weight: 800;
}

#updated {
  white-space: nowrap;
  font-size: 10px;
}


/* =====================
   統計
===================== */

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 7px;
  margin-bottom: 15px;
}

.stats > div {
  padding: 10px 5px;

  border: 1px solid #203b59;
  border-radius: 13px;

  background: #0d2035;

  text-align: center;
}

.stats span {
  display: block;
  color: #8094aa;
  font-size: 10px;
  margin-bottom: 3px;
}

.stats b {
  font-size: 18px;
}


/* =====================
   レースカード
===================== */

.race-card {

  width: 100%;

  margin-bottom: 14px;
  padding: 17px;

  border: 1px solid #203b59;
  border-radius: 19px;

  background: #0d2035;

  overflow: hidden;
}

.race-card.hot {
  border: 2px solid #e7b83e;
}


/* レース上部 */

.race-top {
  display: flex;
  justify-content: space-between;

  gap: 10px;

  min-width: 0;
}

.race-title {
  font-size: 20px;
  font-weight: 900;

  overflow-wrap: anywhere;
}

.grade {
  display: inline-block;

  margin-left: 5px;
  padding: 3px 6px;

  border-radius: 6px;

  background: #233b56;

  color: #c8d7e7;

  font-size: 9px;
  vertical-align: middle;
}

.event-title {
  margin-top: 5px;

  color: #d0dcea;

  font-size: 12px;
  line-height: 1.45;

  overflow-wrap: anywhere;
}

.subtitle {
  margin-top: 2px;

  color: #7f93aa;

  font-size: 10px;

  overflow-wrap: anywhere;
}

.deadline {
  margin-top: 5px;

  color: #8296ac;

  font-size: 11px;
}


/* =====================
   自信度
===================== */

.confidence {
  flex-shrink: 0;

  width: 67px;

  text-align: center;
}

.level {
  margin-bottom: 4px;
  padding: 4px 3px;

  border-radius: 7px;

  background: #183a5c;
  color: #69b8ff;

  font-size: 10px;
  font-weight: 800;
}

.hot-level {
  background: #604812;
  color: #ffd66b;
}

.confidence strong {
  display: block;

  font-size: 27px;
  line-height: 1;
}

.confidence small {
  color: #7e92a8;
  font-size: 9px;
}


/* =====================
   本命
===================== */

.main-pick {

  margin-top: 13px;
  padding: 14px;

  border-radius: 14px;

  background: #08192b;
}

.pick-label {
  color: #6f9bc1;

  font-size: 10px;
  font-weight: 700;
}

.pick-name {

  margin-top: 3px;

  font-size: 21px;
  font-weight: 900;

  overflow-wrap: anywhere;
}

.pick-reason {

  margin-top: 6px;

  color: #91a6bc;

  font-size: 10px;
  line-height: 1.55;

  overflow-wrap: anywhere;
}


/* =====================
   着順候補
===================== */

.place {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  margin-top: 10px;
}

.place > div {

  padding: 9px;

  border-radius: 10px;

  background: #102a43;

  color: #d1dce8;

  font-size: 12px;

  overflow-wrap: anywhere;
}

.place b {

  display: block;

  margin-bottom: 2px;

  color: #7594b3;

  font-size: 9px;
}


/* =====================
   買い目
===================== */

.bets {

  margin-top: 13px;
}

.bets-title {

  margin-bottom: 7px;

  color: #8ba0b7;

  font-size: 10px;
  font-weight: 700;
}

.bet-list {

  display: flex;

  flex-wrap: wrap;

  gap: 6px;
}

.bet {

  display: flex;

  align-items: center;

  padding: 8px 11px;

  border-radius: 9px;

  background: #173d60;

  color: white;

  font-size: 15px;

  font-weight: 900;

  letter-spacing: 1px;

  white-space: nowrap;
}


/* =====================
   予想変更
===================== */

.change {

  margin-top: 10px;

  padding: 9px 10px;

  border-left: 3px solid #42a5ff;

  border-radius: 5px;

  background: #102a43;

  font-size: 10px;

  line-height: 1.5;

  overflow-wrap: anywhere;
}

.change b {
  display: block;

  color: #55b0ff;

  margin-bottom: 2px;
}

.change span {
  color: #afc0d1;
}


/* =====================
   出走選手
===================== */

.racers {

  display: grid;

  grid-template-columns: repeat(6,1fr);

  gap: 4px;

  margin-top: 12px;
}

.racer {

  min-width: 0;

  padding: 7px 3px;

  border-radius: 8px;

  background: #10263d;

  text-align: center;
}

.racer-no {

  color: #7895b1;

  font-size: 9px;
}

.racer-info b {

  display: block;

  margin-top: 2px;

  font-size: 10px;

  line-height: 1.25;

  overflow-wrap: anywhere;
}

.racer-info span {

  display: block;

  margin-top: 2px;

  color: #8195aa;

  font-size: 8px;
}

.racer-time {

  margin-top: 2px;

  color: #9eb2c7;

  font-size: 9px;
}


/* =====================
   推奨なし
===================== */

.empty,
.loading {

  padding: 42px 20px;

  border: 1px solid #203b59;
  border-radius: 19px;

  background: #0d2035;

  text-align: center;
}

.empty-title {

  font-size: 20px;
  font-weight: 900;

  line-height: 1.5;
}

.empty-text {

  margin-top: 12px;

  color: #9bacc0;

  font-size: 12px;

  line-height: 1.8;
}

.empty-refresh {

  margin-top: 16px;

  padding: 10px 17px;

  border: 1px solid #1768a8;
  border-radius: 10px;

  background: #123452;

  color: white;

  font-weight: 700;
}


/* =====================
   基準
===================== */

.rules {

  margin-top: 18px;
  padding: 18px;

  border: 1px solid #203b59;
  border-radius: 17px;

  background: #0b1b2e;
}

.rules h2 {

  margin: 0 0 10px;

  font-size: 16px;
}

.rules ul {

  margin: 0;

  padding-left: 18px;
}

.rules li {

  margin: 6px 0;

  color: #8fa1b5;

  font-size: 11px;

  line-height: 1.55;
}


/* =====================
   フッター
===================== */

footer {

  display: flex;
  justify-content: space-between;

  gap: 10px;

  margin-top: 18px;

  color: #60748a;

  font-size: 9px;
}


/* =====================
   スマホ
===================== */

@media (max-width:600px) {

  .app {
    padding-left: 14px;
    padding-right: 14px;
  }

  .topbar {
    align-items: flex-start;
  }

  h1 {
    font-size: 25px;
  }

  .status-card {
    padding: 15px;
  }

  .race-card {
    padding: 14px;
  }

  .race-title {
    font-size: 18px;
  }

  .pick-name {
    font-size: 19px;
  }

  .racers {
    gap: 3px;
  }

  .racer {
    padding-left: 2px;
    padding-right: 2px;
  }

  .racer-info b {
    font-size: 9px;
  }

}


/* かなり小さい画面 */

@media (max-width:380px) {

  h1 {
    font-size: 22px;
  }

  .refresh {
    padding: 9px 12px;
  }

  .racers {
    grid-template-columns: repeat(3,1fr);
  }

}

</style>

</head>


<body>

<main class="app">


<header class="topbar">

  <div>

    <div class="eyebrow">
      BOAT RACE / PERSONAL
    </div>

    <h1>
      予想屋サイバーはっちゃん
    </h1>

    <div
      id="date"
      class="muted">
      読み込み中…
    </div>

  </div>


  <button
    id="refresh"
    class="refresh">
    更新
  </button>

</header>


<section class="status-card">

  <div>

    <div class="status-title">
      判定状況
    </div>

    <div id="status">
      データ取得中…
    </div>

  </div>


  <div
    id="updated"
    class="muted">
  </div>

</section>


<section id="notice"></section>


<section id="picks"></section>


<section class="rules">

  <h2>
    このアプリの基準
  </h2>

  <ul>

    <li>
      実際のBOAT RACEデータだけを使用します。
    </li>

    <li>
      自信度の高い順に最大5レースを表示します。
    </li>

    <li>
      「激アツ」「本命」「有力」の3段階で評価します。
    </li>

    <li>
      1着・2着・3着候補を総合的に評価します。
    </li>

    <li>
      展示タイム・進入・展示STなどの直前情報を反映します。
    </li>

    <li>
      予想が変更された場合は変更理由を表示します。
    </li>

  </ul>

</section>


<footer>

  <span>
    データ：Boatrace Open API
  </span>

  <span>
    このアプリは投票を行いません
  </span>

</footer>


</main>


<script src="app.js?v=20260902"></script>

</body>

</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="今日の競艇・固いレースだけを表示する個人用Webアプリ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>今日の固いレース</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">BOAT RACE / PERSONAL</div>
        <h1>今日の固いレース</h1>
        <div id="date" class="muted"></div>
      </div>
      <button id="refresh" class="refresh">更新</button>
    </header>

    <section class="status-card">
      <div>
        <div class="status-title">判定状況</div>
        <div id="status">データ取得中…</div>
      </div>
      <div id="updated" class="muted"></div>
    </section>

    <section id="notice" class="notice hidden"></section>
    <section id="picks"></section>

    <section class="rules">
      <h2>このアプリの基準</h2>
      <ul>
        <li>推奨レースが少なくても、基準未達なら無理に表示しません。</li>
        <li>1着候補の信頼度を最重視し、2・3着候補を別に評価します。</li>
        <li>展示タイム・進入・STなどの直前情報が取得できたら再評価します。</li>
        <li>結果が取得できたレースは端末内の履歴に記録します。</li>
      </ul>
    </section>

    <footer>
      <span>データ：Boatrace Open API</span>
      <span>このアプリは投票を行いません</span>
    </footer>
  </main>
  <script src="app.js"></script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>

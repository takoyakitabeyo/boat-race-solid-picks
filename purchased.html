<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08111f"
  >

  <title>購入済み - 予想屋サイバーはっちゃん</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      background: #08111f;
    }

    body {
      margin: 0;
      background: #08111f;
      color: #e8eef5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      line-height: 1.5;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin-bottom: 3px;
      color: #66809a;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    h1 {
      margin: 0;
      color: #ffffff;
      font-size: 23px;
      font-weight: 900;
    }

    .back {
      padding: 9px 12px;
      border: 1px solid #27435f;
      border-radius: 10px;
      background: #10263d;
      color: #dcecff;
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .period-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .period-tab {
      padding: 9px 5px;
      border: 1px solid #1b334d;
      border-radius: 9px;
      background: #0c1c2e;
      color: #71869b;
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
    }

    .period-tab.active {
      border-color: #356487;
      background: #123552;
      color: #ffffff;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 18px;
    }

    .summary-box {
      padding: 12px 5px;
      border: 1px solid #1b334d;
      border-radius: 12px;
      background: #0c1c2e;
      text-align: center;
    }

    .summary-box b {
      display: block;
      color: #ffffff;
      font-size: 18px;
      line-height: 1.1;
    }

    .summary-box span {
      color: #687e94;
      font-size: 7px;
      font-weight: 800;
    }

    .purchase-card {
      padding: 14px;
      margin-bottom: 11px;
      border: 1px solid #1b334d;
      border-radius: 14px;
      background: #0c1c2e;
    }

    .purchase-card.hit {
      border-color: #386b4e;
    }

    .purchase-card.miss {
      border-color: #53333b;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .race-name {
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
    }

    .race-sub {
      margin-top: 2px;
      color: #71869b;
      font-size: 9px;
    }

    .result-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 7px;
      background: #182b3d;
      color: #91a5b8;
      font-size: 9px;
      font-weight: 900;
    }

    .result-badge.hit {
      background: #173c2a;
      color: #91ddb0;
    }

    .result-badge.miss {
      background: #3b2028;
      color: #e29ba8;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 11px;
    }

    .detail {
      padding: 8px;
      border-radius: 8px;
      background: #091725;
    }

    .detail span {
      display: block;
      margin-bottom: 1px;
      color: #5f758b;
      font-size: 8px;
    }

    .detail b {
      color: #b9c8d6;
      font-size: 10px;
      overflow-wrap: anywhere;
    }

    .bets {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #172d43;
    }

    .bets-label {
      margin-bottom: 6px;
      color: #647b91;
      font-size: 8px;
      font-weight: 800;
    }

    .bet-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .bet {
      padding: 6px 9px;
      border: 1px solid #244c6e;
      border-radius: 7px;
      background: #123552;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
    }

    .bet.hit-bet {
      border-color: #3e8d5e;
      background: #173c2a;
      color: #a8efc0;
    }

    .actual-result {
      margin-top: 9px;
      padding: 8px;
      border-radius: 8px;
      background: #101f2e;
      color: #aabaca;
      font-size: 9px;
    }

    .payout {
      margin-top: 7px;
      padding: 8px;
      border-radius: 8px;
      background: #173c2a;
      color: #a8efc0;
      font-size: 10px;
      font-weight: 900;
    }

    .empty {
      padding: 35px 15px;
      border: 1px solid #1b334d;
      border-radius: 14px;
      background: #0c1c2e;
      text-align: center;
    }

    .empty-title {
      color: #d8e2eb;
      font-size: 13px;
      font-weight: 900;
    }

    .empty-text {
      margin-top: 5px;
      color: #71869d;
      font-size: 10px;
    }

    .delete-area {
      display: flex;
      justify-content: flex-end;
      margin-top: 9px;
    }

    .delete-button {
      padding: 6px 9px;
      border: 1px solid #49323a;
      border-radius: 7px;
      background: transparent;
      color: #9b717b;
      font-size: 8px;
      font-weight: 800;
      cursor: pointer;
    }

    .clear-all {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border: 1px solid #49323a;
      border-radius: 9px;
      background: transparent;
      color: #9b717b;
      font-size: 9px;
      font-weight: 800;
      cursor: pointer;
    }

    footer {
      padding-top: 20px;
      color: #4f6479;
      font-size: 8px;
      text-align: center;
    }

    @media (max-width: 600px) {

      .app {
        padding: 15px 13px 35px;
      }

      h1 {
        font-size: 20px;
      }

      .summary-box b {
        font-size: 17px;
      }

    }

  </style>
</head>

<body>

  <main class="app">

    <header class="topbar">

      <div>

        <div class="eyebrow">
          BOAT RACE / PURCHASED
        </div>

        <h1>
          購入済みレース
        </h1>

      </div>

      <a
        href="index.html"
        class="back"
      >
        ← 予想一覧
      </a>

    </header>

    <div class="period-tabs">

      <button
        class="period-tab active"
        data-period="all"
      >
        全期間
      </button>

      <button
        class="period-tab"
        data-period="month"
      >
        今月
      </button>

      <button
        class="period-tab"
        data-period="today"
      >
        今日
      </button>

    </div>

    <section class="summary">

      <div class="summary-box">
        <b id="total-count">0</b>
        <span>購入</span>
      </div>

      <div class="summary-box">
        <b id="settled-count">0</b>
        <span>結果確定</span>
      </div>

      <div class="summary-box">
        <b id="hit-count">0</b>
        <span>的中</span>
      </div>

      <div class="summary-box">
        <b id="hit-rate">-</b>
        <span>的中率</span>
      </div>

    </section>

    <section id="purchase-list">

      <div class="empty">

        <div class="empty-title">
          購入履歴を読み込んでいます
        </div>

        <div class="empty-text">
          少々お待ちください
        </div>

      </div>

    </section>

    <button
      id="clear-all"
      class="clear-all"
      type="button"
    >
      購入履歴をすべて削除
    </button>

    <footer>
      「買った」ボタンを押したレースだけが成績に反映されます。
    </footer>

  </main>

  <script>

    const PURCHASED_KEY = "cyber-hacchan-purchased-v2";
    const RESULTS_KEY = "boatResults";
    const API =
      "https://boatraceopenapi.github.io/api/v1/today.json";

    const STADIUMS = {
      1:"桐生",
      2:"戸田",
      3:"江戸川",
      4:"平和島",
      5:"多摩川",
      6:"浜名湖",
      7:"蒲郡",
      8:"常滑",
      9:"津",
      10:"三国",
      11:"びわこ",
      12:"住之江",
      13:"尼崎",
      14:"鳴門",
      15:"丸亀",
      16:"児島",
      17:"宮島",
      18:"徳山",
      19:"下関",
      20:"若松",
      21:"芦屋",
      22:"福岡",
      23:"唐津",
      24:"大村"
    };

    let selectedPeriod = "all";

    function getPurchasedPageData() {
      try {
        return JSON.parse(
          localStorage.getItem(PURCHASED_KEY) || "{}"
        );
      } catch {
        return {};
      }
    }

    function getResultsData() {
      try {
        return JSON.parse(
          localStorage.getItem(RESULTS_KEY) || "{}"
        );
      } catch {
        return {};
      }
    }

    function saveResultsData(data) {
      try {
        localStorage.setItem(
          RESULTS_KEY,
          JSON.stringify(data)
        );
      } catch {}
    }

    function escapePageHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getRaceDate(item) {

      if (item.date) {
        return String(item.date).slice(0, 10);
      }

      if (item.cutoff) {
        return String(item.cutoff)
          .replace(" ", "T")
          .slice(0, 10);
      }

      if (item.purchasedAt) {

        const n = Number(item.purchasedAt);

        if (Number.isFinite(n)) {
          return new Date(n)
            .toLocaleDateString(
              "sv-SE",
              {
                timeZone: "Asia/Tokyo"
              }
            );
        }

        return new Date(item.purchasedAt)
          .toLocaleDateString(
            "sv-SE",
            {
              timeZone: "Asia/Tokyo"
            }
          );
      }

      return "";
    }

    function getRaceKey(item) {

      const date = getRaceDate(item);

      const stadium =
        item.stadiumNo ??
        item.stadium_number ??
        "";

      const race =
        item.raceNo ??
        item.race_number ??
        "";

      if (
        date &&
        stadium !== "" &&
        race !== ""
      ) {
        return `${date}-${stadium}-${race}`;
      }

      if (item.key) {
        return String(item.key);
      }

      return "";
    }

    function isToday(item) {

      const today =
        new Date()
          .toLocaleDateString(
            "sv-SE",
            {
              timeZone: "Asia/Tokyo"
            }
          );

      return getRaceDate(item) === today;
    }

    function isThisMonth(item) {

      const today =
        new Date()
          .toLocaleDateString(
            "sv-SE",
            {
              timeZone: "Asia/Tokyo"
            }
          );

      return (
        getRaceDate(item).slice(0, 7) ===
        today.slice(0, 7)
      );
    }

    function filterItems(items) {

      if (selectedPeriod === "today") {
        return items.filter(isToday);
      }

      if (selectedPeriod === "month") {
        return items.filter(isThisMonth);
      }

      return items;
    }

    function normalizeCombination(value) {

      if (value == null) {
        return "";
      }

      if (Array.isArray(value)) {
        return value.join("-");
      }

      const s = String(value)
        .trim()
        .replace(/[①②③④⑤⑥]/g, "")
        .replace(/[ー－–—]/g, "-")
        .replace(/\s+/g, "");

      const nums =
        s.match(/[1-6]/g);

      if (nums && nums.length >= 3) {
        return nums.slice(0, 3).join("-");
      }

      return s;
    }

    function resultFromApi(r) {

      if (!r || !r.result) {
        return null;
      }

      const racers =
        r.result.racers;

      if (racers) {

        const places =
          Object.entries(racers)
            .map(([entry, data]) => ({
              entry: Number(entry),
              place: Number(data?.place_number)
            }))
            .filter(x =>
              Number.isFinite(x.entry) &&
              Number.isFinite(x.place)
            )
            .sort((a, b) =>
              a.place - b.place
            );

        if (places.length >= 3) {

          return {
            combination:
              places
                .slice(0, 3)
                .map(x => x.entry)
                .join("-"),
            payout:
              getTrifectaPayout(
                r.result.payouts
              )
          };
        }
      }

      return null;
    }

    function getTrifectaPayout(payouts) {

      if (!payouts) {
        return null;
      }

      let trifecta =
        payouts.trifecta;

      if (Array.isArray(trifecta)) {

        const first =
          trifecta[0];

        return first?.amount ??
          first?.payout ??
          null;
      }

      if (trifecta) {

        return trifecta.amount ??
          trifecta.payout ??
          null;
      }

      return null;
    }

    function getStoredResult(item) {

      const results =
        getResultsData();

      const key =
        getRaceKey(item);

      if (key && results[key]) {
        return results[key];
      }

      /*
       * 以前のバージョンで
       * 日付なしキーを使っていた場合にも対応
       */
      const stadium =
        item.stadiumNo ??
        item.stadium_number ??
        "";

      const race =
        item.raceNo ??
        item.race_number ??
        "";

      const oldKey =
        `${stadium}-${race}`;

      if (results[oldKey]) {
        return results[oldKey];
      }

      return null;
    }

    function applyResultToItem(item, stored) {

      if (!stored) {
        return item;
      }

      const actual =
        normalizeCombination(
          stored.combination
        );

      if (!actual) {
        return item;
      }

      const bets =
        Array.isArray(item.bets)
          ? item.bets
          : [];

      const normalizedBets =
        bets.map(normalizeCombination);

      item.result =
        actual.split("-").map(Number);

      item.hit =
        normalizedBets.includes(actual);

      if (
        stored.amount != null &&
        stored.payout == null
      ) {
        stored.payout = stored.amount;
      }

      item.payout =
        stored.payout ??
        stored.amount ??
        item.payout ??
        null;

      item.resultUpdatedAt =
        stored.at ||
        new Date().toISOString();

      return item;
    }

    async function fetchTodayResults() {

      try {

        const response =
          await fetch(
            `${API}?t=${Date.now()}`,
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            `API ${response.status}`
          );
        }

        const data =
          await response.json();

        const results =
          getResultsData();

        for (
          const stadium
          of Object.values(
            data.programs?.stadiums || {}
          )
        ) {

          for (
            const r
            of Object.values(
              stadium.races || {}
            )
          ) {

            const result =
              resultFromApi(r);

            if (!result) {
              continue;
            }

            const key =
              `${r.date}-${r.stadium_number}-${r.race_number}`;

            results[key] = {
              combination:
                result.combination,
              payout:
                result.payout,
              at:
                new Date().toISOString()
            };
          }
        }

        saveResultsData(results);

      } catch (error) {

        console.warn(
          "結果取得失敗:",
          error
        );

      }
    }

    function syncPurchasedResults() {

      const data =
        getPurchasedPageData();

      const results =
        getResultsData();

      let changed = false;

      Object.values(data)
        .forEach(item => {

          const key =
            getRaceKey(item);

          let stored =
            key
              ? results[key]
              : null;

          if (!stored) {

            const stadium =
              item.stadiumNo ??
              item.stadium_number ??
              "";

            const race =
              item.raceNo ??
              item.race_number ??
              "";

            stored =
              results[
                `${stadium}-${race}`
              ];
          }

          if (!stored) {
            return;
          }

          const before =
            JSON.stringify({
              result: item.result,
              hit: item.hit,
              payout: item.payout
            });

          applyResultToItem(
            item,
            stored
          );

          const after =
            JSON.stringify({
              result: item.result,
              hit: item.hit,
              payout: item.payout
            });

          if (before !== after) {
            changed = true;
          }

        });

      if (changed) {

        localStorage.setItem(
          PURCHASED_KEY,
          JSON.stringify(data)
        );
      }

      return data;
    }

    function renderSummary(items) {

      const total =
        items.length;

      const settled =
        items.filter(
          item =>
            Array.isArray(item.result) &&
            item.result.length >= 3 &&
            typeof item.hit === "boolean"
        ).length;

      const hits =
        items.filter(
          item =>
            item.hit === true
        ).length;

      const rate =
        settled > 0
          ? `${(
              hits / settled * 100
            ).toFixed(1)}%`
          : "-";

      document.getElementById(
        "total-count"
      ).textContent = total;

      document.getElementById(
        "settled-count"
      ).textContent = settled;

      document.getElementById(
        "hit-count"
      ).textContent = hits;

      document.getElementById(
        "hit-rate"
      ).textContent = rate;
    }

    function renderPurchase(item) {

      const resultReady =
        Array.isArray(item.result) &&
        item.result.length >= 3 &&
        typeof item.hit === "boolean";

      const cardClass =
        resultReady
          ? item.hit
            ? "hit"
            : "miss"
          : "";

      const badgeClass =
        resultReady
          ? item.hit
            ? "hit"
            : "miss"
          : "";

      const badgeText =
        resultReady
          ? item.hit
            ? "的中"
            : "外れ"
          : "結果待ち";

      const resultText =
        resultReady
          ? item.result.join(" - ")
          : "まだ結果が確定していません";

      const bets =
        Array.isArray(item.bets)
          ? item.bets
          : [];

      const actual =
        resultReady
          ? normalizeCombination(
              item.result
            )
          : "";

      const betsHtml =
        bets
          .map(bet => {

            const normalized =
              normalizeCombination(
                bet
              );

            const isHitBet =
              resultReady &&
              item.hit === true &&
              normalized === actual;

            return `
              <div class="bet ${
                isHitBet
                  ? "hit-bet"
                  : ""
              }">
                ${escapePageHtml(bet)}
              </div>
            `;

          })
          .join("");

      const payout =
        item.payout != null
          ? `
            <div class="payout">
              払戻金：
              ${Number(
                item.payout
              ).toLocaleString("ja-JP")}円
            </div>
          `
          : "";

      const stadiumName =
        item.stadiumName ||
        STADIUMS[
          item.stadiumNo ??
          item.stadium_number
        ] ||
        "";

      const raceNo =
        item.raceNo ??
        item.race_number ??
        "";

      return `
        <article
          class="purchase-card ${cardClass}"
        >

          <div class="card-top">

            <div>

              <div class="race-name">
                ${escapePageHtml(
                  stadiumName
                )}
                ${escapePageHtml(
                  raceNo
                )}R
              </div>

              <div class="race-sub">

                ${escapePageHtml(
                  item.grade || ""
                )}

                ${
                  item.title
                    ? ` / ${escapePageHtml(
                        item.title
                      )}`
                    : ""
                }

              </div>

            </div>

            <div
              class="result-badge ${badgeClass}"
            >
              ${badgeText}
            </div>

          </div>

          <div class="details">

            <div class="detail">

              <span>本命</span>

              <b>

                ${item.mainNo || "-"}号艇

                ${
                  item.mainName
                    ? escapePageHtml(
                        item.mainName
                      )
                    : ""
                }

              </b>

            </div>

            <div class="detail">

              <span>自信度</span>

              <b>
                ${item.confidence || "-"}
              </b>

            </div>

            <div class="detail">

              <span>購入日</span>

              <b>
                ${getRaceDate(item) || "-"}
              </b>

            </div>

            <div class="detail">

              <span>買い目点数</span>

              <b>
                ${bets.length}点
              </b>

            </div>

          </div>

          <div class="bets">

            <div class="bets-label">
              推奨買い目
            </div>

            <div class="bet-list">
              ${betsHtml}
            </div>

          </div>

          <div class="actual-result">

            ${
              resultReady
                ? `
                  実際の結果：
                  <b>
                    ${escapePageHtml(
                      resultText
                    )}
                  </b>
                `
                : resultText
            }

          </div>

          ${payout}

          <div class="delete-area">

            <button
              class="delete-button"
              data-delete="${
                escapePageHtml(
                  item.key || ""
                )
              }"
              type="button"
            >
              この履歴を削除
            </button>

          </div>

        </article>
      `;
    }

    function renderPurchasedPage() {

      const data =
        syncPurchasedResults();

      const items =
        Object.values(data)
          .sort(
            (a, b) =>
              safeTime(b.purchasedAt) -
              safeTime(a.purchasedAt)
          );

      const filtered =
        filterItems(items);

      renderSummary(
        filtered
      );

      const list =
        document.getElementById(
          "purchase-list"
        );

      if (!filtered.length) {

        list.innerHTML = `
          <div class="empty">

            <div class="empty-title">
              購入履歴はありません
            </div>

            <div class="empty-text">
              予想一覧で「買った」を押すと、
              ここに記録されます。
            </div>

          </div>
        `;

      } else {

        list.innerHTML =
          filtered
            .map(renderPurchase)
            .join("");

      }

      bindDeleteButtons();
    }

    function safeTime(value) {

      const n =
        Number(value);

      if (Number.isFinite(n)) {
        return n;
      }

      const d =
        Date.parse(value);

      return Number.isFinite(d)
        ? d
        : 0;
    }

    function bindDeleteButtons() {

      document
        .querySelectorAll(
          "[data-delete]"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                const key =
                  button.dataset.delete;

                const data =
                  getPurchasedPageData();

                delete data[key];

                localStorage.setItem(
                  PURCHASED_KEY,
                  JSON.stringify(data)
                );

                renderPurchasedPage();

              }
            );

          }
        );
    }

    document
      .querySelectorAll(
        ".period-tab"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              selectedPeriod =
                button.dataset.period;

              document
                .querySelectorAll(
                  ".period-tab"
                )
                .forEach(
                  b =>
                    b.classList.toggle(
                      "active",
                      b === button
                    )
                );

              renderPurchasedPage();

            }
          );

        }
      );

    document
      .getElementById(
        "clear-all"
      )
      .addEventListener(
        "click",
        () => {

          const data =
            getPurchasedPageData();

          if (
            !Object.keys(data).length
          ) {
            return;
          }

          if (
            !confirm(
              "購入履歴をすべて削除しますか？"
            )
          ) {
            return;
          }

          localStorage.removeItem(
            PURCHASED_KEY
          );

          renderPurchasedPage();

        }
      );

    async function initialize() {

      /*
       * まず保存済み結果を即座に反映
       */
      renderPurchasedPage();

      /*
       * さらにAPIから最新結果を取得
       * → 保存
       * → 購入履歴へ反映
       */
      await fetchTodayResults();

      renderPurchasedPage();
    }

    initialize();

    /*
     * 3分ごとに結果を再確認
     */
    setInterval(
      async () => {

        await fetchTodayResults();

        renderPurchasedPage();

      },
      180000
    );

  </script>

</body>

</html>

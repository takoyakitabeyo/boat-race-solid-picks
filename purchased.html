<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>買ったレース</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#f3f5f8;
      color:#172033;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    }
    main{
      width:min(760px,100%);
      margin:auto;
      padding:16px;
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }
    h1{
      margin:0;
      font-size:24px;
    }
    .sub{
      color:#667085;
      font-size:12px;
      margin-top:4px;
    }
    button{
      border:0;
      border-radius:10px;
      padding:10px 14px;
      font-weight:700;
      cursor:pointer;
    }
    .refresh{
      background:#172033;
      color:white;
    }
    .summary{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-bottom:14px;
    }
    .summary-box{
      background:white;
      border-radius:14px;
      padding:12px 8px;
      text-align:center;
      box-shadow:0 2px 10px rgba(0,0,0,.05);
    }
    .summary-label{
      font-size:11px;
      color:#667085;
    }
    .summary-value{
      font-size:20px;
      font-weight:800;
      margin-top:4px;
    }
    .tabs{
      display:flex;
      background:white;
      border-radius:12px;
      padding:4px;
      margin-bottom:14px;
    }
    .tab{
      flex:1;
      background:transparent;
      color:#667085;
      padding:9px 4px;
    }
    .tab.active{
      background:#172033;
      color:white;
    }
    .status{
      background:white;
      border-radius:12px;
      padding:12px;
      margin-bottom:12px;
      font-size:13px;
      color:#667085;
    }
    .card{
      background:white;
      border-radius:16px;
      padding:15px;
      margin-bottom:12px;
      box-shadow:0 2px 12px rgba(0,0,0,.06);
    }
    .card-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
    }
    .race-name{
      font-size:18px;
      font-weight:800;
    }
    .title{
      margin-top:3px;
      font-size:12px;
      color:#667085;
    }
    .confidence{
      white-space:nowrap;
      font-weight:800;
      font-size:13px;
    }
    .main{
      margin-top:12px;
      padding:12px;
      background:#f7f8fa;
      border-radius:12px;
    }
    .main-label{
      font-size:11px;
      color:#667085;
    }
    .main-name{
      font-size:17px;
      font-weight:800;
      margin-top:3px;
    }
    .bets{
      margin-top:12px;
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }
    .bet{
      padding:7px 9px;
      border-radius:8px;
      background:#eef1f5;
      font-weight:700;
      font-size:13px;
    }
    .bet.hit{
      background:#d9f7df;
      color:#16733a;
      box-shadow:inset 0 0 0 2px #31a354;
    }
    .result{
      margin-top:12px;
      padding:11px;
      border-radius:10px;
      background:#f7f8fa;
      font-size:13px;
    }
    .result.hit{
      background:#e7f8eb;
      color:#16733a;
    }
    .result.miss{
      background:#fff0f0;
      color:#b42318;
    }
    .result.pending{
      color:#667085;
    }
    .meta{
      margin-top:10px;
      font-size:11px;
      color:#8a93a3;
      display:flex;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
    }
    .delete{
      margin-top:10px;
      background:#f1f3f5;
      color:#667085;
      font-size:11px;
      padding:7px 10px;
    }
    .empty{
      background:white;
      border-radius:14px;
      padding:30px 15px;
      text-align:center;
      color:#667085;
    }
    .danger{
      margin-top:18px;
      width:100%;
      background:#fff0f0;
      color:#b42318;
    }
    @media(max-width:500px){
      .summary{
        grid-template-columns:repeat(2,1fr);
      }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>買ったレース</h1>
      <div class="sub">購入履歴・結果・的中率</div>
    </div>
    <button id="refresh" class="refresh">更新</button>
  </header>
  <section class="summary">
    <div class="summary-box">
      <div class="summary-label">購入</div>
      <div id="total" class="summary-value">0</div>
    </div>
    <div class="summary-box">
      <div class="summary-label">結果確定</div>
      <div id="settled" class="summary-value">0</div>
    </div>
    <div class="summary-box">
      <div class="summary-label">的中</div>
      <div id="hits" class="summary-value">0</div>
    </div>
    <div class="summary-box">
      <div class="summary-label">的中率</div>
      <div id="rate" class="summary-value">--%</div>
    </div>
  </section>
  <section class="tabs">
    <button class="tab active" data-period="all">全期間</button>
    <button class="tab" data-period="month">今月</button>
    <button class="tab" data-period="today">今日</button>
  </section>
  <section id="status" class="status">
    結果を確認しています…
  </section>
  <section id="list"></section>
  <button id="clearAll" class="danger">
    購入履歴をすべて削除
  </button>
</main>
<script>
const PURCHASED_KEY = "cyber-hacchan-purchased-v2";
const RESULTS_KEY = "boatResults";
const API_BASE =
  "https://boatraceopenapi.github.io/api/v1";
const STADIUMS = {
  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"
};
let period = "all";
let purchases = [];
let results = {};
const $ = s => document.querySelector(s);
function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}
function loadPurchases(){
  try{
    const raw = JSON.parse(
      localStorage.getItem(PURCHASED_KEY) || "[]"
    );
    if(Array.isArray(raw)){
      return raw;
    }
    if(raw && Array.isArray(raw.items)){
      return raw.items;
    }
    return [];
  }catch{
    return [];
  }
}
function loadStoredResults(){
  try{
    const raw = JSON.parse(
      localStorage.getItem(RESULTS_KEY) || "{}"
    );
    return raw && typeof raw === "object" ? raw : {};
  }catch{
    return {};
  }
}
function saveStoredResults(){
  try{
    localStorage.setItem(
      RESULTS_KEY,
      JSON.stringify(results)
    );
  }catch{}
}
function normalizeDate(v){
  if(!v)return "";
  const s = String(v);
  const m = s.match(/(20\d{2})[-\/]?(\d{2})[-\/]?(\d{2})/);
  if(!m)return "";
  return `${m[1]}-${m[2]}-${m[3]}`;
}
function normalizeNumber(v){
  if(v === null || v === undefined || v === "")return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}
function raceKey(date,stadiumNo,raceNo){
  const d = normalizeDate(date);
  const s = normalizeNumber(stadiumNo);
  const r = normalizeNumber(raceNo);
  if(!d || s === null || r === null)return "";
  return `${d}-${s}-${r}`;
}
function normalizeBet(v){
  if(v === null || v === undefined)return "";
  return String(v)
    .trim()
    .replace(/[＝=]/g,"-")
    .replace(/[－–—]/g,"-")
    .replace(/\s+/g,"")
    .replace(/[^1-6-]/g,"");
}
function normalizeBets(v){
  if(Array.isArray(v)){
    return v
      .flatMap(x => normalizeBets(x))
      .filter(Boolean);
  }
  if(typeof v === "string"){
    return v
      .split(/[,\n、\/]+/)
      .map(normalizeBet)
      .filter(Boolean);
  }
  return [];
}
function purchaseBets(item){
  return normalizeBets(
    item.bets ??
    item.bet ??
    item.combinations ??
    item.combination ??
    item.buyBets ??
    []
  );
}
function purchaseDate(item){
  return normalizeDate(
    item.date ??
    item.raceDate ??
    item.racedate ??
    item.開催日
  );
}
function stadiumNo(item){
  return normalizeNumber(
    item.stadiumNo ??
    item.stadium_number ??
    item.stadium ??
    item.venueNo
  );
}
function raceNo(item){
  return normalizeNumber(
    item.raceNo ??
    item.race_number ??
    item.race
  );
}
function purchaseKey(item){
  return raceKey(
    purchaseDate(item),
    stadiumNo(item),
    raceNo(item)
  );
}
function getTodayJST(){
  const s = new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Asia/Tokyo",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(new Date());
  return s;
}
function getMonth(date){
  return date ? date.slice(0,7) : "";
}
function formatDate(date){
  if(!date)return "-";
  const m = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return date;
  return `${m[1]}/${m[2]}/${m[3]}`;
}
function extractResultFromRace(r){
  if(!r)return null;
  const result = r.result || r;
  let combination = "";
  const payouts =
    result.payouts ||
    r.payouts ||
    {};
  const trifecta =
    payouts.trifecta ||
    payouts["3t"] ||
    [];
  if(Array.isArray(trifecta) && trifecta.length){
    combination =
      trifecta[0]?.combination || "";
  }
  combination = normalizeBet(combination);
  let amount = null;
  if(Array.isArray(trifecta) && trifecta.length){
    amount =
      normalizeNumber(trifecta[0]?.amount);
  }
  /*
   * 払戻データが取れなくても、
   * racers の place_number から実着順を作る。
   */
  if(!combination){
    const racers =
      result.racers ||
      r.result?.racers ||
      {};
    const arr = Object.values(racers)
      .map(x => ({
        entry:Number(x.entry_number),
        place:Number(x.place_number)
      }))
      .filter(x =>
        Number.isFinite(x.entry) &&
        Number.isFinite(x.place) &&
        x.place >= 1 &&
        x.place <= 3
      )
      .sort((a,b)=>a.place-b.place);
    if(arr.length >= 3){
      combination =
        `${arr[0].entry}-${arr[1].entry}-${arr[2].entry}`;
    }
  }
  if(!combination)return null;
  return {
    combination,
    amount,
    date:normalizeDate(
      result.date ||
      r.date
    )
  };
}
function saveRaceResult(r){
  const date =
    normalizeDate(
      r.date ||
      r.result?.date
    );
  const stadium =
    normalizeNumber(
      r.stadium_number ||
      r.result?.stadium_number
    );
  const race =
    normalizeNumber(
      r.race_number ||
      r.result?.race_number
    );
  const data =
    extractResultFromRace(r);
  if(!date || stadium === null || race === null || !data){
    return;
  }
  const key =
    raceKey(date,stadium,race);
  results[key] = {
    combination:data.combination,
    amount:data.amount,
    updatedAt:new Date().toISOString()
  };
}
async function fetchJson(url){
  const controller =
    new AbortController();
  const timer =
    setTimeout(
      ()=>controller.abort(),
      15000
    );
  try{
    const res =
      await fetch(
        url,
        {
          cache:"no-store",
          signal:controller.signal
        }
      );
    if(!res.ok){
      throw new Error(
        `HTTP ${res.status}`
      );
    }
    return await res.json();
  }finally{
    clearTimeout(timer);
  }
}
async function fetchDateResults(date){
  if(!date)return;
  /*
   * まず現在のAPI v1を使用。
   * 指定日付のデータを直接取得する。
   */
  const y =
    date.slice(0,4);
  const compact =
    date.replaceAll("-","");
  const url =
    `${API_BASE}/${y}/${compact}.json`;
  try{
    const data =
      await fetchJson(url);
    const stadiums =
      data.programs?.stadiums || {};
    for(const stadium of Object.values(stadiums)){
      for(const r of Object.values(
        stadium.races || {}
      )){
        if(
          r.result?.racers ||
          r.result?.payouts
        ){
          saveRaceResult(r);
        }
      }
    }
    return true;
  }catch(e){
    console.warn(
      "結果取得失敗:",
      date,
      e
    );
    return false;
  }
}
async function fetchResultsForPurchases(){
  const dates =
    [...new Set(
      purchases
        .map(purchaseDate)
        .filter(Boolean)
    )];
  const missingDates =
    dates.filter(date => {
      return !purchases.some(item => {
        const key =
          purchaseKey(item);
        return (
          key &&
          results[key]
        );
      });
    });
  /*
   * 日付単位でAPIを取得。
   * 同じ日のレースを何度も取得しない。
   */
  for(const date of dates){
    const alreadyHasDate =
      Object.keys(results).some(
        key => key.startsWith(date + "-")
      );
    if(alreadyHasDate){
      continue;
    }
    await fetchDateResults(date);
  }
  saveStoredResults();
}
function buildActualResult(item){
  const key =
    purchaseKey(item);
  if(results[key]){
    return results[key];
  }
  /*
   * 古い保存形式への対応
   */
  const oldKey =
    `${stadiumNo(item)}-${raceNo(item)}`;
  if(results[oldKey]){
    return results[oldKey];
  }
  return null;
}
function evaluate(item){
  const bets =
    purchaseBets(item);
  const actual =
    buildActualResult(item);
  if(!actual){
    return {
      settled:false,
      hit:false,
      actual:null,
      bets
    };
  }
  const hit =
    bets.includes(
      normalizeBet(actual.combination)
    );
  return {
    settled:true,
    hit,
    actual,
    bets
  };
}
function filteredPurchases(){
  const today =
    getTodayJST();
  const month =
    today.slice(0,7);
  if(period === "today"){
    return purchases.filter(
      p => purchaseDate(p) === today
    );
  }
  if(period === "month"){
    return purchases.filter(
      p => getMonth(purchaseDate(p)) === month
    );
  }
  return purchases;
}
function renderSummary(list){
  const evaluated =
    list.map(evaluate);
  const settled =
    evaluated.filter(
      x => x.settled
    );
  const hits =
    settled.filter(
      x => x.hit
    );
  $("#total").textContent =
    list.length;
  $("#settled").textContent =
    settled.length;
  $("#hits").textContent =
    hits.length;
  $("#rate").textContent =
    settled.length
      ? `${((hits.length / settled.length) * 100).toFixed(1)}%`
      : "--%";
}
function renderCard(item,index){
  const date =
    purchaseDate(item);
  const stadium =
    stadiumNo(item);
  const race =
    raceNo(item);
  const key =
    purchaseKey(item);
  const evaluation =
    evaluate(item);
  const bets =
    evaluation.bets;
  const confidence =
    item.confidence ??
    item.score ??
    item.s ??
    "";
  const mainNo =
    item.mainNo ??
    item.main_number ??
    item.oneNo ??
    item.mainBoat ??
    "";
  const mainName =
    item.mainName ??
    item.main_name ??
    item.oneName ??
    "";
  const title =
    item.title ??
    item.raceTitle ??
    "";
  const stadiumName =
    STADIUMS[stadium] ||
    item.stadiumName ||
    `場${stadium ?? "-"}`;
  let resultHtml = "";
  if(!evaluation.settled){
    resultHtml = `
      <div class="result pending">
        結果待ち
      </div>
    `;
  }else if(evaluation.hit){
    resultHtml = `
      <div class="result hit">
        <b>的中</b>
        ・実着 ${esc(evaluation.actual.combination)}
        ${
          evaluation.actual.amount !== null
            ? `・払戻 ${evaluation.actual.amount.toLocaleString()}円`
            : ""
        }
      </div>
    `;
  }else{
    resultHtml = `
      <div class="result miss">
        <b>ハズレ</b>
        ・実着 ${esc(evaluation.actual.combination)}
        ${
          evaluation.actual.amount !== null
            ? `・払戻 ${evaluation.actual.amount.toLocaleString()}円`
            : ""
        }
      </div>
    `;
  }
  const betsHtml =
    bets.length
      ? bets.map(bet => {
          const hit =
            evaluation.settled &&
            normalizeBet(
              evaluation.actual?.combination
            ) === normalizeBet(bet);
          return `
            <span class="bet ${hit ? "hit" : ""}">
              ${esc(bet)}
            </span>
          `;
        }).join("")
      : `<span class="bet">買い目なし</span>`;
  return `
    <article class="card">
      <div class="card-top">
        <div>
          <div class="race-name">
            ${esc(stadiumName)} ${esc(race ?? "-")}R
          </div>
          <div class="title">
            ${esc(title)}
          </div>
        </div>
        ${
          confidence !== ""
            ? `<div class="confidence">
                 信頼度 ${esc(confidence)}
               </div>`
            : ""
        }
      </div>
      ${
        mainNo || mainName
          ? `
            <div class="main">
              <div class="main-label">
                1着本命
              </div>
              <div class="main-name">
                ${mainNo ? `①${esc(mainNo)}` : ""}
                ${mainName ? ` ${esc(mainName)}` : ""}
              </div>
            </div>
          `
          : ""
      }
      <div class="bets">
        ${betsHtml}
      </div>
      ${resultHtml}
      <div class="meta">
        <span>開催日 ${esc(formatDate(date))}</span>
        <span>レース ${esc(key)}</span>
      </div>
      <button
        class="delete"
        onclick="deletePurchase(${index})">
        この購入を削除
      </button>
    </article>
  `;
}
function render(){
  const list =
    filteredPurchases();
  renderSummary(list);
  if(!list.length){
    $("#list").innerHTML = `
      <div class="empty">
        購入履歴はありません。
      </div>
    `;
    $("#status").textContent =
      "購入履歴 0件";
    return;
  }
  const evaluated =
    list.map(evaluate);
  const settled =
    evaluated.filter(x=>x.settled).length;
  $("#status").textContent =
    `購入 ${list.length}件 / 結果確定 ${settled}件`;
  /*
   * 新しい購入順
   */
  const indexed =
    list
      .map((item,i)=>({item,i}))
      .sort((a,b)=>{
        const da =
          new Date(
            a.item.purchasedAt ||
            a.item.createdAt ||
            a.item.savedAt ||
            0
          );
        const db =
          new Date(
            b.item.purchasedAt ||
            b.item.createdAt ||
            b.item.savedAt ||
            0
          );
        return db-da;
      });
  $("#list").innerHTML =
    indexed
      .map(x =>
        renderCard(
          x.item,
          purchases.indexOf(x.item)
        )
      )
      .join("");
}
function deletePurchase(index){
  if(!confirm("この購入履歴を削除しますか？")){
    return;
  }
  purchases.splice(index,1);
  localStorage.setItem(
    PURCHASED_KEY,
    JSON.stringify(purchases)
  );
  render();
}
async function refresh(){
  $("#status").textContent =
    "過去の結果を取得しています…";
  purchases =
    loadPurchases();
  results =
    loadStoredResults();
  /*
   * 購入履歴に存在する日付を全部確認。
   * 昨日・一昨日などもここで取得する。
   */
  await fetchResultsForPurchases();
  render();
  $("#status").textContent =
    `購入 ${filteredPurchases().length}件 / 結果確認済み`;
}
document
  .querySelectorAll(".tab")
  .forEach(btn=>{
    btn.addEventListener(
      "click",
      ()=>{
        document
          .querySelectorAll(".tab")
          .forEach(x =>
            x.classList.remove("active")
          );
        btn.classList.add("active");
        period =
          btn.dataset.period;
        render();
      }
    );
  });
$("#refresh")
  .addEventListener(
    "click",
    refresh
  );
$("#clearAll")
  .addEventListener(
    "click",
    ()=>{
      if(!confirm(
        "購入履歴をすべて削除しますか？"
      )){
        return;
      }
      localStorage.removeItem(
        PURCHASED_KEY
      );
      purchases = [];
      render();
    }
  );
/*
 * 初回読み込み
 */
refresh();
/*
 * 3分ごとに結果確認
 */
setInterval(
  refresh,
  180000
);
</script>
</body>
</html>

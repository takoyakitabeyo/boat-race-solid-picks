<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>購入済み舟券</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07111f;
  color:#e7eef8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

.app{
  width:min(760px,100%);
  margin:auto;
  padding:18px 14px 40px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.eyebrow{
  font-size:10px;
  letter-spacing:.14em;
  color:#71839d;
  margin-bottom:4px;
}

h1{
  margin:0;
  font-size:25px;
  line-height:1.2;
}

.muted{
  color:#8495ad;
}

.back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:9px 13px;
  border-radius:10px;
  border:1px solid #263b58;
  background:#101d30;
  color:#dce7f7;
  text-decoration:none;
  font-size:12px;
}

.summary{
  margin-top:16px;
  padding:15px;
  border:1px solid #21344e;
  border-radius:15px;
  background:#0d1929;
}

.summary-title{
  color:#8d9bb0;
  font-size:11px;
}

.summary-number{
  font-size:30px;
  font-weight:800;
  margin-top:2px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:12px;
}

.stat{
  padding:10px;
  border-radius:10px;
  background:#111f32;
  text-align:center;
}

.stat b{
  display:block;
  font-size:18px;
}

.stat span{
  color:#8091aa;
  font-size:10px;
}

.tabs{
  display:flex;
  gap:7px;
  margin-top:14px;
  overflow-x:auto;
}

.tab{
  flex:0 0 auto;
  border:1px solid #263b58;
  background:#101d30;
  color:#aebbd0;
  padding:9px 14px;
  border-radius:999px;
  font-size:12px;
}

.tab.active{
  background:#1b314d;
  color:#fff;
  border-color:#3c628d;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.action{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:1px solid #263b58;
  background:#101d30;
  color:#dce7f7;
  font-size:12px;
}

.list{
  display:grid;
  gap:12px;
  margin-top:14px;
}

.card{
  background:#0d1929;
  border:1px solid #21344e;
  border-radius:16px;
  padding:15px;
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.race-name{
  font-size:19px;
  font-weight:800;
}

.race-date{
  margin-top:3px;
  color:#8495ad;
  font-size:11px;
}

.event{
  margin-top:6px;
  color:#c4d0df;
  font-size:12px;
  line-height:1.5;
}

.level{
  white-space:nowrap;
  padding:5px 8px;
  border-radius:999px;
  background:#172940;
  color:#a9c4e8;
  font-size:10px;
  height:max-content;
}

.main{
  margin-top:12px;
  padding:11px;
  background:#0a1423;
  border:1px solid #263b58;
  border-radius:12px;
}

.main-label{
  color:#8293aa;
  font-size:10px;
}

.main-name{
  margin-top:2px;
  font-size:20px;
  font-weight:800;
}

.bets-title{
  margin-top:12px;
  color:#8293aa;
  font-size:10px;
}

.bets{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:6px;
}

.bet{
  padding:7px 9px;
  border-radius:8px;
  background:#17263b;
  border:1px solid #2a415f;
  font-size:12px;
  font-weight:700;
}

.result{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#111f32;
  font-size:12px;
}

.result.hit{
  border:1px solid #43705b;
  background:#10251d;
}

.result.miss{
  border:1px solid #573d42;
  background:#24161a;
}

.result-none{
  color:#8191a8;
}

.result-title{
  font-size:10px;
  color:#8495ad;
}

.result-combination{
  margin-top:3px;
  font-size:18px;
  font-weight:800;
}

.purchase-time{
  margin-top:9px;
  color:#6f8199;
  font-size:10px;
}

.delete{
  margin-top:12px;
  width:100%;
  padding:9px;
  border-radius:9px;
  border:1px solid #3b2b32;
  background:#17141a;
  color:#9c8790;
  font-size:11px;
}

.empty{
  padding:30px 15px;
  text-align:center;
  background:#0d1929;
  border:1px dashed #33445f;
  border-radius:16px;
  color:#9baac0;
  line-height:1.7;
}

.loading{
  padding:25px;
  text-align:center;
  color:#8d9bb0;
}

footer{
  margin-top:18px;
  color:#667891;
  font-size:10px;
  text-align:center;
}

@media(max-width:520px){
  h1{
    font-size:23px;
  }

  .summary-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .race-name{
    font-size:18px;
  }
}
</style>
</head>

<body>

<main class="app">

  <header class="topbar">
    <div>
      <div class="eyebrow">BOAT RACE / HISTORY</div>
      <h1>購入済み舟券</h1>
      <div class="muted" id="todayText"></div>
    </div>

    <a class="back" href="index.html">
      ← 戻る
    </a>
  </header>


  <section class="summary">

    <div class="summary-title">
      購入履歴
    </div>

    <div class="summary-number" id="summaryCount">
      0
    </div>

    <div class="summary-grid">

      <div class="stat">
        <b id="hitCount">0</b>
        <span>的中</span>
      </div>

      <div class="stat">
        <b id="missCount">0</b>
        <span>ハズレ</span>
      </div>

      <div class="stat">
        <b id="hitRate">--</b>
        <span>的中率</span>
      </div>

    </div>

  </section>


  <div class="tabs">

    <button class="tab active" data-period="all">
      全期間
    </button>

    <button class="tab" data-period="month">
      今月
    </button>

    <button class="tab" data-period="today">
      今日
    </button>

  </div>


  <div class="actions">

    <button class="action" id="refreshBtn">
      結果を更新
    </button>

    <button class="action" id="clearBtn">
      全履歴を削除
    </button>

  </div>


  <section id="list" class="list">
    <div class="loading">
      購入履歴を読み込み中…
    </div>
  </section>


  <footer>
    購入履歴はこの端末のブラウザに保存されています
  </footer>

</main>


<script>

const PURCHASED_KEY =
  "cyber-hacchan-purchased-v2";

const RESULTS_KEY =
  "boatResults";

const API_BASE =
  "https://boatraceopenapi.github.io/api/v1";


const STADIUMS = {
  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"
};


let period = "all";


const $ = s =>
  document.querySelector(s);


function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/*
  JSTの日付
*/

function jstDate(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Tokyo",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(new Date());

  const y =
    parts.find(x => x.type === "year")?.value;

  const m =
    parts.find(x => x.type === "month")?.value;

  const d =
    parts.find(x => x.type === "day")?.value;

  return `${y}-${m}-${d}`;

}


function normalizeDate(v){

  if(!v) return null;

  const s =
    String(v).slice(0,10);

  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    return s;
  }

  return null;

}


/*
  ここが今回の重要修正。

  dateが無い古い購入データでも、
  purchasedAtから日付を復元する。
*/

function getDate(item){

  const direct =
    normalizeDate(item.date);

  if(direct){
    return direct;
  }

  const purchased =
    item.purchasedAt ||
    item.purchased_at;

  if(purchased){

    try{

      const parts =
        new Intl.DateTimeFormat(
          "en-CA",
          {
            timeZone:"Asia/Tokyo",
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
          }
        ).formatToParts(
          new Date(purchased)
        );

      const y =
        parts.find(x => x.type === "year")?.value;

      const m =
        parts.find(x => x.type === "month")?.value;

      const d =
        parts.find(x => x.type === "day")?.value;

      if(y && m && d){
        return `${y}-${m}-${d}`;
      }

    }catch{}

  }

  return null;

}


/*
  購入データ読み込み

  壊れた1件があっても
  全履歴が消えないようにする。
*/

function loadPurchased(){

  try{

    const raw =
      localStorage.getItem(
        PURCHASED_KEY
      );

    if(!raw){
      return [];
    }

    const data =
      JSON.parse(raw);

    if(!Array.isArray(data)){
      return [];
    }

    return data;

  }catch(e){

    console.error(e);

    return [];

  }

}


function savePurchased(list){

  localStorage.setItem(
    PURCHASED_KEY,
    JSON.stringify(list)
  );

}


/*
  結果保存
*/

function loadResults(){

  try{

    return JSON.parse(
      localStorage.getItem(
        RESULTS_KEY
      ) || "{}"
    );

  }catch{

    return {};

  }

}


function saveResult(
  date,
  stadium,
  race,
  combination,
  amount
){

  if(!date || !stadium || !race || !combination){
    return;
  }

  const results =
    loadResults();

  const key =
    `${date}-${stadium}-${race}`;

  results[key] = {
    combination,
    amount:amount ?? null,
    at:new Date().toISOString()
  };

  localStorage.setItem(
    RESULTS_KEY,
    JSON.stringify(results)
  );

}


/*
  購入履歴からAPI取得用URLを作る
*/

function apiURL(date){

  const compact =
    date.replaceAll("-","");

  return `${API_BASE}/${date.slice(0,4)}/${compact}.json`;

}


async function fetchDate(date){

  try{

    const res =
      await fetch(
        apiURL(date),
        {
          cache:"no-store"
        }
      );

    if(!res.ok){
      return null;
    }

    return await res.json();

  }catch(e){

    console.warn(
      "結果取得失敗:",
      date,
      e
    );

    return null;

  }

}


/*
  過去日の結果を取得
*/

async function updateResults(){

  const purchases =
    loadPurchased();

  const dates =
    [
      ...new Set(
        purchases
          .map(getDate)
          .filter(Boolean)
      )
    ];

  if(!dates.length){
    return;
  }

  /*
    すでに保存されている結果を残しつつ、
    購入履歴の日付を取得する。
  */

  for(
    const date of dates
  ){

    const data =
      await fetchDate(date);

    if(!data){
      continue;
    }

    const stadiums =
      data.programs?.stadiums || {};

    for(
      const stadium of
      Object.values(stadiums)
    ){

      for(
        const race of
        Object.values(
          stadium.races || {}
        )
      ){

        const trifecta =
          race.result
            ?.payouts
            ?.trifecta
            ?.[0];

        if(
          trifecta?.combination
        ){

          saveResult(
            race.date,
            race.stadium_number,
            race.race_number,
            trifecta.combination,
            trifecta.amount
          );

        }

      }

    }

  }

}


/*
  期間フィルター
*/

function inPeriod(item){

  const date =
    getDate(item);

  if(!date){
    return true;
  }

  const today =
    jstDate();

  if(period === "today"){
    return date === today;
  }

  if(period === "month"){
    return date.slice(0,7) === today.slice(0,7);
  }

  return true;

}


/*
  結果取得
*/

function getResult(item){

  const results =
    loadResults();

  const date =
    getDate(item);

  const stadium =
    item.stadium_number;

  const race =
    item.race_number;

  if(
    !date ||
    stadium == null ||
    race == null
  ){

    return null;

  }

  return results[
    `${date}-${stadium}-${race}`
  ] || null;

}


/*
  組み合わせを統一
*/

function normalizeCombination(v){

  if(v == null){
    return "";
  }

  return String(v)
    .replaceAll(" ","")
    .replaceAll("→","-")
    .replaceAll("＝","-")
    .replaceAll("=","-");

}


/*
  購入舟券の的中判定
*/

function isHit(item,result){

  if(!result){
    return false;
  }

  const actual =
    normalizeCombination(
      result.combination
    );

  const bets =
    Array.isArray(item.bets)
      ? item.bets
      : [];

  return bets.some(
    bet =>
      normalizeCombination(bet)
      === actual
  );

}


/*
  結果が存在するか
*/

function hasResult(item){

  return !!getResult(item);

}


/*
  期間内の購入データ
*/

function currentPurchases(){

  return loadPurchased()
    .filter(inPeriod)
    .sort(
      (a,b) => {

        const da =
          getDate(a) || "";

        const db =
          getDate(b) || "";

        if(da !== db){
          return db.localeCompare(da);
        }

        const ta =
          a.purchasedAt || "";

        const tb =
          b.purchasedAt || "";

        return tb.localeCompare(ta);

      }
    );

}


/*
  統計
*/

function renderSummary(list){

  const finished =
    list.filter(
      hasResult
    );

  const hit =
    finished.filter(
      x =>
        isHit(
          x,
          getResult(x)
        )
    );

  const miss =
    finished.length - hit.length;

  const rate =
    finished.length
      ? `${Math.round(
          hit.length /
          finished.length *
          100
        )}%`
      : "--";

  $("#summaryCount").textContent =
    list.length;

  $("#hitCount").textContent =
    hit.length;

  $("#missCount").textContent =
    miss;

  $("#hitRate").textContent =
    rate;

}


/*
  カード
*/

function renderCard(item){

  const date =
    getDate(item) || "日付不明";

  const stadium =
    STADIUMS[
      item.stadium_number
    ] ||
    item.stadium_name ||
    `場${item.stadium_number ?? ""}`;

  const race =
    item.race_number != null
      ? `${item.race_number}R`
      : "レース";

  const result =
    getResult(item);

  const hit =
    result &&
    isHit(item,result);

  const bets =
    Array.isArray(item.bets)
      ? item.bets
      : [];

  const betsHTML =
    bets.length
      ? bets
          .map(
            b =>
              `<span class="bet">
                ${esc(b)}
              </span>`
          )
          .join("")
      : `
        <span class="bet">
          買い目なし
        </span>
      `;

  let resultHTML = "";

  if(result){

    resultHTML = `
      <div class="result ${hit ? "hit" : "miss"}">

        <div class="result-title">
          実際の3連単
        </div>

        <div class="result-combination">
          ${esc(result.combination)}
        </div>

        <div style="margin-top:4px">
          ${
            hit
              ? "的中"
              : "ハズレ"
          }

          ${
            result.amount != null
              ? ` / 払戻 ${Number(result.amount).toLocaleString()}円`
              : ""
          }
        </div>

      </div>
    `;

  }else{

    resultHTML = `
      <div class="result">

        <div class="result-none">
          結果待ち
        </div>

      </div>
    `;

  }


  let purchaseTime = "";

  if(item.purchasedAt){

    try{

      purchaseTime =
        new Date(
          item.purchasedAt
        ).toLocaleString(
          "ja-JP",
          {
            timeZone:"Asia/Tokyo",
            month:"numeric",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
          }
        );

    }catch{}

  }


  const key =
    item.key ||
    `${date}-${item.stadium_number}-${item.race_number}`;


  return `

    <article
      class="card"
      data-key="${esc(key)}"
    >

      <div class="card-top">

        <div>

          <div class="race-name">
            ${esc(stadium)}
            ${esc(race)}
          </div>

          <div class="race-date">
            ${esc(date)}
          </div>

          <div class="event">
            ${esc(
              item.title ||
              item.event_title ||
              ""
            )}
          </div>

        </div>

        <div class="level">
          ${esc(
            item.level ||
            "購入済み"
          )}
        </div>

      </div>


      <div class="main">

        <div class="main-label">
          1着本命
        </div>

        <div class="main-name">

          ${
            item.main != null
              ? `${esc(item.main)}号艇 `
              : ""
          }

          ${esc(
            item.mainName ||
            item.main_name ||
            ""
          )}

        </div>

      </div>


      <div class="bets-title">
        購入した買い目
      </div>

      <div class="bets">
        ${betsHTML}
      </div>


      ${resultHTML}


      ${
        purchaseTime
          ? `
            <div class="purchase-time">
              購入日時：${esc(purchaseTime)}
            </div>
          `
          : ""
      }


      <button
        class="delete"
        data-delete="${esc(key)}"
      >
        この履歴を削除
      </button>

    </article>

  `;

}


/*
  一覧表示
*/

function render(){

  const list =
    currentPurchases();

  renderSummary(list);

  const el =
    $("#list");

  if(!list.length){

    el.innerHTML = `
      <div class="empty">

        この期間の購入履歴はありません。

        <br>

        <span class="muted">
          過去の購入履歴は「全期間」で確認できます。
        </span>

      </div>
    `;

    return;

  }

  el.innerHTML =
    list
      .map(renderCard)
      .join("");

}


/*
  個別削除
*/

document.addEventListener(
  "click",
  e => {

    const btn =
      e.target.closest(
        "[data-delete]"
      );

    if(!btn){
      return;
    }

    const key =
      btn.dataset.delete;

    const ok =
      confirm(
        "この購入履歴を削除しますか？"
      );

    if(!ok){
      return;
    }

    const list =
      loadPurchased();

    const next =
      list.filter(
        item => {

          const itemKey =
            item.key ||
            `${getDate(item)}-${item.stadium_number}-${item.race_number}`;

          return itemKey !== key;

        }
      );

    savePurchased(next);

    render();

  }
);


/*
  タブ
*/

document
  .querySelectorAll(".tab")
  .forEach(
    tab => {

      tab.addEventListener(
        "click",
        () => {

          period =
            tab.dataset.period;

          document
            .querySelectorAll(".tab")
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          tab.classList.add(
            "active"
          );

          render();

        }
      );

    }
);


/*
  結果更新
*/

$("#refreshBtn")
  .addEventListener(
    "click",
    async () => {

      const btn =
        $("#refreshBtn");

      btn.disabled = true;
      btn.textContent =
        "結果取得中…";

      try{

        await updateResults();

      }catch(e){

        console.error(e);

      }

      render();

      btn.disabled = false;
      btn.textContent =
        "結果を更新";

    }
  );


/*
  全削除
*/

$("#clearBtn")
  .addEventListener(
    "click",
    () => {

      const list =
        loadPurchased();

      if(!list.length){
        return;
      }

      const ok =
        confirm(
          `購入履歴 ${list.length}件をすべて削除しますか？`
        );

      if(!ok){
        return;
      }

      localStorage.removeItem(
        PURCHASED_KEY
      );

      render();

    }
  );


/*
  今日の日付
*/

$("#todayText").textContent =
  `本日 ${jstDate()}`;


/*
  起動
*/

(async function(){

  render();

  /*
    先に画面を出してから
    過去結果を取得する。
  */

  await updateResults();

  render();

})();


/*
  3分ごとに結果更新
*/

setInterval(
  async () => {

    await updateResults();

    render();

  },
  180000
);

</script>
